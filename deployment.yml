apiVersion: apps/v1
kind: Deployment
metadata:
  name: html-site
  labels:
    app: html-site
spec:
  replicas: 2
  selector:
    matchLabels:
      app: html-site
  template:
    metadata:
      labels:
        app: html-site
    spec:
      containers:
        - name: html-site
          # This gets replaced by the pipeline with: <acr-login-server>/html-site:<build-id>
          image: ACR_LOGIN_SERVER/html-site:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
