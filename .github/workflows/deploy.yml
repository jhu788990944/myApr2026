name: Deploy to AKS

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/myapr2026-site:latest .
        docker push ${{ secrets.DOCKER_USERNAME }}/myapr2026-site:latest

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Set AKS context
      uses: azure/aks-set-context@v4
      with:
        resource-group: kubernati
        cluster-name: skecluster1

    - name: Deploy to AKS
      run: |
        kubectl apply -f k8s-deployment.yaml
        kubectl set image deployment/myapr2026-site myapr2026-site=${{ secrets.DOCKER_USERNAME }}/myapr2026-site:latest
        kubectl rollout status deployment/myapr2026-site
