name: build_deploy_aks

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image
        run: |
          docker build -t zouraiz212/myapr2026-site:${{ github.sha }} .
          docker build -t zouraiz212/myapr2026-site:latest .
          docker push zouraiz212/myapr2026-site:${{ github.sha }}
          docker push zouraiz212/myapr2026-site:latest

      - name: Azure login
        id: login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS context
        id: set-context
        uses: azure/aks-set-context@v4
        with:
          resource-group: 'kubernati'
          cluster-name: 'skecluster1'

      - name: Setup kubectl
        id: install-kubectl
        uses: azure/setup-kubectl@v3

      - name: Deploy to AKS
        id: deploy-aks
        uses: Azure/k8s-deploy@v4
        with:
          namespace: 'default'
          manifests: |
             k8s-deployment.yaml
          images: 'zouraiz212/myapr2026-site:${{ github.sha }}'
          pull-images: false
