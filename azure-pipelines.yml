trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  imageRepository: 'html-site'
  dockerfilePath: 'Dockerfile'
  tag: '$(Build.BuildId)'

steps:

- task: Docker@2
  displayName: Build Docker Image
  inputs:
    command: build
    Dockerfile: $(dockerfilePath)
    repository: $(imageRepository)
    tags: |
      $(tag)