trigger:
  branches:
    include:
      - main

variables:
  # Name of your Azure DevOps "Azure Resource Manager" service connection
  azureServiceConnection: 'my-azure-service-connection'
  terraformDir: 'terraform'
  imageName: 'html-site'
  imageTag: '$(Build.BuildId)'

stages:

  # ---------- Stage 1: Provision infra with Terraform ----------
  - stage: Terraform
    displayName: 'Terraform - Provision AKS + ACR'
    jobs:
      - job: TerraformApply
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: TerraformInstaller@1
            displayName: 'Install Terraform'
            inputs:
              terraformVersion: '1.7.5'

          - task: TerraformTaskV4@4
            displayName: 'Terraform Init'
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(System.DefaultWorkingDirectory)/$(terraformDir)'
              backendServiceArm: '$(azureServiceConnection)'

          - task: TerraformTaskV4@4
            displayName: 'Terraform Apply'
            inputs:
              provider: 'azurerm'
              command: 'apply'
              workingDirectory: '$(System.DefaultWorkingDirectory)/$(terraformDir)'
              environmentServiceNameAzureRM: '$(azureServiceConnection)'

  # ---------- Stage 2: Build & push Docker image ----------
  - stage: Build
    displayName: 'Build and Push Docker Image'
    dependsOn: Terraform
    jobs:
      - job: DockerBuildPush
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: AzureCLI@2
            displayName: 'Get ACR login server & login'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                ACR_NAME=$(az acr list --resource-group rg-html-aks-demo --query "[0].name" -o tsv)
                ACR_LOGIN_SERVER=$(az acr show --name $ACR_NAME --query loginServer -o tsv)
                echo "##vso[task.setvariable variable=ACR_NAME]$ACR_NAME"
                echo "##vso[task.setvariable variable=ACR_LOGIN_SERVER]$ACR_LOGIN_SERVER"
                az acr login --name $ACR_NAME

          - script: |
              docker build -t $(ACR_LOGIN_SERVER)/$(imageName):$(imageTag) .
              docker push $(ACR_LOGIN_SERVER)/$(imageName):$(imageTag)
            displayName: 'Docker build & push'

  # ---------- Stage 3: Deploy to AKS ----------
  - stage: Deploy
    displayName: 'Deploy to AKS'
    dependsOn: Build
    jobs:
      - job: KubectlDeploy
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: AzureCLI@2
            displayName: 'Get AKS credentials'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az aks get-credentials --resource-group rg-html-aks-demo --name aks-html-demo --overwrite-existing
                ACR_NAME=$(az acr list --resource-group rg-html-aks-demo --query "[0].name" -o tsv)
                ACR_LOGIN_SERVER=$(az acr show --name $ACR_NAME --query loginServer -o tsv)
                echo "##vso[task.setvariable variable=ACR_LOGIN_SERVER]$ACR_LOGIN_SERVER"

          - script: |
              sed -i "s#ACR_LOGIN_SERVER/html-site:latest#$(ACR_LOGIN_SERVER)/$(imageName):$(imageTag)#g" kubernetes/deployment.yaml
              kubectl apply -f kubernetes/deployment.yaml
              kubectl apply -f kubernetes/service.yaml
            displayName: 'kubectl apply deployment & service'

          - script: |
              echo "Waiting for external IP..."
              kubectl get service html-site-service
            displayName: 'Show service info'
